<style>:root{--cover:#1F3B36;--cover-dark:#152A26;--paper:#F6F3EA;--paper-raised:#FCFBF6;--line:#DED7C2;--ink:#1C2420;--ink-soft:#5B6560;--ink-faint:#8D9590;--stamp:#A13328;--verified:#3F6B4F;--verified-bg:#E4EDE6;--guess:#A9781F;--guess-bg:#F3E9D2;--wrong:#B23A2E;--wrong-bg:#F7E4E0;--correct-bg:#E4EDE6;--shadow:0 1px 2px rgba(28,36,32,.06),0 2px 10px rgba(28,36,32,.05);}*{box-sizing:border-box;}html,body{margin:0;padding:0;}body{background:var(--cover-dark);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.35);}button{font-family:inherit;}.serif{font-family:ui-serif,Georgia,serif;}.mono{font-family:ui-monospace,monospace;}.eyebrow{font-family:ui-monospace,monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}.topbar{background:var(--cover);color:#F1EFE6;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}.topbar .title{font-weight:600;font-size:.95rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.content{padding:18px 18px 100px;flex:1;}.btn{appearance:none;border:none;cursor:pointer;font-weight:600;font-size:.86rem;border-radius:8px;padding:13px 14px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:background-color .15s ease,transform .1s ease;}.btn:active{transform:scale(.97);}.btn-primary{background:var(--stamp);color:#fff;box-shadow:var(--shadow);}.btn-secondary{background:var(--paper-raised);color:var(--cover);border:1.5px solid var(--line);}.btn-block{width:100%;}.btn:disabled{opacity:.4;cursor:not-allowed;}.progressbar-top{height:4px;background:var(--line);}.progressbar-top-fill{height:100%;background:var(--stamp);transition:width .3s ease;}.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 0;font-family:ui-monospace,monospace;font-size:.74rem;color:var(--ink-soft);gap:10px;}.qcard-clean{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:22px 18px;margin-top:14px;box-shadow:var(--shadow);}.qcard-clean-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}.qcard-clean-head .eyebrow{font-size:.65rem;letter-spacing:.12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}.qcard-clean .q-text{font-family:ui-serif,Georgia,serif;font-size:1.2rem;line-height:1.45;font-weight:500;color:var(--ink);margin:0 0 20px 0;}.opt-clean{display:flex;align-items:center;gap:14px;width:100%;text-align:left;box-sizing:border-box;min-height:52px;padding:12px 16px;margin-bottom:8px;font-size:1rem;line-height:1.35;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;transition:border-color .15s ease,background-color .15s ease;}.opt-clean:active{background:#EDE9DC;border-color:var(--cover);}.opt-clean .opt-letter{font-family:ui-monospace,monospace;font-weight:600;font-size:.75rem;width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1.5px solid var(--ink-faint);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}.opt-clean.selected{border-color:var(--cover);background:#E8EFE9;}.opt-clean.selected .opt-letter{background:var(--cover);border-color:var(--cover);color:#fff;}.opt-clean.correct{border-color:var(--verified);background:var(--correct-bg);}.opt-clean.correct .opt-letter{background:var(--verified);border-color:var(--verified);color:#fff;}.opt-clean.incorrect{border-color:var(--wrong);background:var(--wrong-bg);}.opt-clean.incorrect .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff;}.opt-clean.disabled{cursor:default;}.opt-clean.dim{opacity:.5;}.feedback{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:8px;}.feedback.ok{background:var(--correct-bg);color:var(--verified);}.feedback.bad{background:var(--wrong-bg);color:var(--wrong);}.explain-box{margin-top:10px;padding:11px 13px;border-left:3px solid var(--cover);background:var(--paper);border-radius:0 8px 8px 0;font-size:.85rem;line-height:1.5;color:var(--ink-soft);}.explain-box .explain-label{font-family:ui-monospace,monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cover);font-weight:600;display:block;margin-bottom:4px;}.diff-pill{font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;flex:0 0 auto;}.diff-pill.d1{background:var(--verified-bg);color:var(--verified);}.diff-pill.d2{background:var(--guess-bg);color:var(--guess);}.diff-pill.d3{background:var(--wrong-bg);color:var(--wrong);}.footer-bar{position:sticky;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent,var(--paper) 30%);padding:14px 18px 18px;display:flex;gap:10px;}.stamp-result{display:flex;flex-direction:column;align-items:center;padding:26px 10px 8px;}.stamp-circle{width:132px;height:132px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-6deg);font-family:ui-monospace,monospace;position:relative;}.stamp-circle::before{content:"";position:absolute;inset:6px;border:1px solid var(--stamp);border-radius:50%;opacity:.5;}.stamp-circle.good{border-color:var(--verified);color:var(--verified);}.stamp-circle.good::before{border-color:var(--verified);}.stamp-circle.mid{border-color:var(--guess);color:var(--guess);}.stamp-circle.mid::before{border-color:var(--guess);}.stamp-circle b{font-size:1.9rem;line-height:1;}.stamp-circle span{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;}.stamp-caption{margin-top:14px;font-family:ui-serif,Georgia,serif;font-size:1rem;text-align:center;}.review-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;}.review-row .ico{flex:0 0 auto;font-size:1rem;margin-top:1px;}.review-row .body{flex:1;min-width:0;}.review-row .rq{font-size:.86rem;margin-bottom:4px;line-height:1.35;}.review-row .ra{font-size:.78rem;color:var(--ink-soft);line-height:1.4;}.review-row .ra b{color:var(--verified);}.review-row .ra .wrong-ans{color:var(--wrong);text-decoration:line-through;margin-right:6px;}.actions{display:flex;gap:10px;margin:18px 0 6px;}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px;}.section-head h2{font-family:ui-serif,Georgia,serif;font-size:1rem;font-weight:600;margin:0;}@media (prefers-reduced-motion:reduce){*{transition:none !important;}}</style>

<script>var QUIZ_DATA = [{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Nell'autolavaggio a tunnel l'ingresso di una vettura è rilevato da un sensore; trascorsi 2 secondi, un sistema di visione artificiale memorizza il dato numerico, ottenuto dall'elaborazione delle immagini della vettura, in un'apposita variabile.» Nel brano, che cosa significa «elaborazione delle immagini»?","A":"La stampa delle fotografie","B":"L'analisi dei dati contenuti nelle immagini per ricavarne un'informazione","C":"La pulizia dell'obiettivo","D":"Il montaggio di un filmato","risposta":"B","feedback":"Elaborare le immagini significa analizzarle con procedure automatiche per ottenere un dato, qui il livello di sporcizia.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Acquisito il valore numerico, si attiva un sistema di traino a catena che fa avanzare il veicolo; quando il veicolo oltrepassa il sensore, il sistema di traino si arresta.» Nel brano, che cosa significa «oltrepassa»?","A":"Raggiunge senza arrivare","B":"Supera, va oltre","C":"Tocca","D":"Evita","risposta":"B","feedback":"Oltrepassare vuol dire passare al di là di un punto: il veicolo supera il sensore e solo allora il traino si ferma.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sistema di traino a catena fa avanzare il veicolo nell'autolavaggio.» Nel brano, che cosa significa «traino»?","A":"Il movimento che tira un oggetto facendolo avanzare","B":"Una forma di lavaggio","C":"Un tipo di sensore","D":"Un freno","risposta":"A","feedback":"Il traino è l'azione del trascinare: la catena tira la vettura lungo il tunnel.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Quando la vettura raggiunge il sensore il sistema di traino viene arrestato e avviata la rotazione delle spazzole contemporaneamente allo spostamento orizzontale delle stesse.» Nel brano, che cosa significa «delle stesse»?","A":"Delle spazzole","B":"Delle vetture","C":"Dei sensori","D":"Delle catene","risposta":"A","feedback":"Il pronome «stesse» richiama le spazzole: ruotano e insieme si spostano in orizzontale.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il ciclo viene ripetuto per altre due volte, dopodiché la rotazione delle spazzole si arresta e il sistema di traino riparte.» Quante volte in tutto viene eseguito il ciclo?","A":"Due","B":"Tre","C":"Quattro","D":"Una","risposta":"B","feedback":"Il ciclo si esegue una volta e poi si ripete altre due volte: in totale tre.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il generatore di aria calda viene gestito dal controllore in modo che la temperatura misurata al suo interno sia mantenuta tra 40 e 60 gradi.» Nel brano, che cosa significa «mantenuta tra 40 e 60 gradi»?","A":"Fatta restare entro quell'intervallo","B":"Portata a 100 gradi","C":"Fissata a 40 gradi","D":"Lasciata libera","risposta":"A","feedback":"Mantenere indica la permanenza entro i limiti: la temperatura non deve scendere sotto 40 né salire oltre 60.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato determini il valore da assegnare al parametro A al fine di ottenere la velocità a regime nel minor tempo, garantendo una risposta priva di oscillazioni che potrebbero pregiudicare l'affidabilità del sistema.» Nel brano, che cosa significa «pregiudicare»?","A":"Giudicare in anticipo","B":"Compromettere, danneggiare","C":"Migliorare","D":"Misurare","risposta":"B","feedback":"Pregiudicare significa mettere a rischio: le oscillazioni potrebbero ridurre l'affidabilità del traino.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La tabella mostra i valori del guadagno e dello sfasamento ottenuti in uscita dallo scambiatore di calore sollecitato in ingresso da un segnale sinusoidale.» Nel brano, che cosa significa «sollecitato»?","A":"Invitato con insistenza","B":"Sottoposto a una sollecitazione, stimolato","C":"Fermato","D":"Scaldato","risposta":"B","feedback":"In ambito tecnico sollecitare un sistema significa applicargli un segnale d'ingresso per studiarne la risposta.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, avvalendosi del foglio di carta semilogaritmica allegato alla prova, disegni i diagrammi.» Nel brano, che cosa significa «allegato»?","A":"Inserito insieme alla prova, accluso","B":"Cancellato","C":"Rubato","D":"Ripetuto","risposta":"A","feedback":"Allegato è ciò che accompagna un documento: il foglio viene consegnato insieme alla traccia.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Quando le ruote anteriori raggiungono un apposito finecorsa, un cilindro sposta il blocco spazzole verso lo pneumatico, rimanendo in tale posizione per 30 secondi in modo che anche le ruote posteriori siano lucidate.» Qual è lo scopo dei 30 secondi di sosta?","A":"Raffreddare il cilindro","B":"Dare tempo alle ruote posteriori di arrivare e di essere lucidate","C":"Spegnere il sensore","D":"Lavare la vettura","risposta":"B","feedback":"«In modo che» introduce la finalità: la sosta permette di trattare anche le ruote posteriori.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, dopo aver definito cosa si intende per indirizzo IP e per maschera di sottorete, verifichi se l'Host 1 è in grado di scambiare dati con gli altri nodi, motivando le affermazioni date.» Nel brano, che cosa significa «verifichi»?","A":"Controlli con un ragionamento se la condizione è vera","B":"Dimentichi","C":"Costruisca","D":"Sposti","risposta":"A","feedback":"Verificare significa accertare la correttezza di un'ipotesi: qui, se la comunicazione è possibile.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «DCS e SCADA sono tecnologie sempre più spesso utilizzate in ambito industriale e infrastrutturale.» Nel brano, che cosa significa «infrastrutturale»?","A":"Relativo a reti e strutture di servizio, come quelle di energia o acqua","B":"Relativo ai soli edifici scolastici","C":"Relativo all'arte","D":"Relativo ai mezzi di trasporto privati","risposta":"A","feedback":"Le infrastrutture sono i grandi sistemi di servizio, come reti elettriche, idriche e di trasporto.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Nell'impianto si producono pannelli per cabine elettriche a partire da fogli di lamiera impilati su un pallet; i fogli dapprima sono depallettizzati, poi punzonati e infine pannellati.» Nel brano, che cosa significa «impilati»?","A":"Sovrapposti uno sull'altro","B":"Appesi","C":"Tagliati","D":"Incollati","risposta":"A","feedback":"Impilare vuol dire disporre in pila: i fogli sono accatastati.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Tre stazioni di lavorazione sono adibite all'esecuzione delle suddette operazioni.» Nel brano, che cosa significa «suddette»?","A":"Appena citate sopra","B":"Sconosciute","C":"Poco importanti","D":"Future","risposta":"A","feedback":"«Suddetto» rimanda a ciò che è stato già nominato: depallettizzazione, punzonatura e pannellatura.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «I fogli di lamiera, di spessore 6 mm, sono impilati senza ordine prestabilito su un pallet.» Nel brano, che cosa significa «senza ordine prestabilito»?","A":"Disposti in modo non definito in anticipo","B":"Disposti secondo uno schema rigido","C":"Numerati","D":"Colorati","risposta":"A","feedback":"Non c'è una disposizione fissata a priori: per questo il sistema deve misurare l'altezza della catasta.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'altezza della catasta è misurata mediante un sensore ultrasonico, piazzato a 2000 mm da terra, che punta alla catasta.» Nel brano, che cosa significa «piazzato»?","A":"Posizionato, collocato","B":"Venduto","C":"Rotto","D":"Pulito","risposta":"A","feedback":"Piazzare, in senso colloquiale tecnico, significa mettere in un certo posto.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il manipolatore cartesiano ha come testa di presa un sistema di ventose pneumatiche a depressione.» Nel brano, che cosa significa «testa di presa»?","A":"L'organo terminale che afferra il pezzo","B":"La parte che pensa","C":"La base della macchina","D":"Un sensore di altezza","risposta":"A","feedback":"La testa di presa, o gripper, è l'elemento con cui il manipolatore afferra il pezzo.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'azionamento dei motori responsabili del movimento di ciascuno dei due assi è ottenuto grazie a un driver.» Nel brano, che cosa significa «responsabili del movimento»?","A":"Che si assumono una colpa","B":"Che producono il movimento","C":"Che lo impediscono","D":"Che lo misurano","risposta":"B","feedback":"Qui «responsabile» indica la causa: i motori sono ciò che genera lo spostamento degli assi.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il punzone viene portato alla quota operativa mediante un servosistema idraulico.» Nel brano, che cosa significa «quota operativa»?","A":"L'altezza alla quale avviene la lavorazione","B":"Il costo dell'operazione","C":"La quantità di pezzi","D":"Il turno di lavoro","risposta":"A","feedback":"La quota è l'altezza o posizione di riferimento; operativa indica che è quella di lavoro.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In condizioni reali, al segnale di misura è sovrapposto quello di rumore captato dal cavo del sensore; pertanto, nella linea di retroazione, è presente un filtro passa basso per eliminare il suddetto disturbo.» Perché si inserisce il filtro?","A":"Per amplificare il segnale","B":"Per eliminare il rumore sovrapposto alla misura","C":"Per ridurre la forza","D":"Per scaldare il cavo","risposta":"B","feedback":"Il testo lo dice con «pertanto»: poiché il rumore disturba la misura, si inserisce un filtro che lo elimini.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La pannellatrice è una macchina nella quale una pressa agisce sulla lamiera piegandola in modo da ottenere un profilo predeterminato.» Nel brano, che cosa significa «predeterminato»?","A":"Stabilito prima","B":"Casuale","C":"Impossibile","D":"Rovinato","risposta":"A","feedback":"Il prefisso «pre-» indica anticipo: la forma finale è decisa in precedenza.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato individui l'entità dell'errore a regime, ipotizzando la presenza di un disturbo a gradino unitario nella forza di taglio.» Nel brano, che cosa significa «a gradino unitario»?","A":"Che sale a un valore fisso e vi resta","B":"Che oscilla","C":"Che scende gradualmente","D":"Che è casuale","risposta":"A","feedback":"Un gradino è una variazione improvvisa che poi si mantiene costante, come il salire di un gradino.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato avvalendosi della tabella determini il diametro della ventosa da installare nell'impianto sapendo che il livello di vuoto è di -60 kPa.» Nel brano, che cosa significa «da installare»?","A":"Da collocare e montare","B":"Da smontare","C":"Da vendere","D":"Da rompere","risposta":"A","feedback":"Installare significa montare un componente in un impianto, rendendolo operativo.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La comunicazione tra i dispositivi presenti nelle reti industriali è possibile grazie alla presenza di protocolli di comunicazione.» Che cosa significa «grazie a»?","A":"A causa negativa di","B":"Per merito di, in virtù di","C":"Nonostante","D":"Dopo","risposta":"B","feedback":"«Grazie a» introduce la causa favorevole: senza protocolli i dispositivi non potrebbero dialogare.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La figura mostra le risposte al gradino e i diagrammi di quattro sistemi, disposti senza un ordine particolare; il candidato identifichi la coppia di grafici appartenente a ciascun sistema.» Nel brano, che cosa significa «senza un ordine particolare»?","A":"In modo mescolato, non corrispondente","B":"In ordine alfabetico","C":"In ordine crescente","D":"In ordine di importanza","risposta":"A","feedback":"I grafici non sono accoppiati nella figura: sta al candidato abbinarli.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In un impianto di assemblaggio, su una flangia proveniente da una precedente lavorazione deve essere saldato un tubo a sua volta proveniente da un'altra linea.» Nel brano, che cosa significa «assemblaggio»?","A":"Unione di più parti per formare un insieme","B":"Smontaggio di un oggetto","C":"Verniciatura","D":"Imballaggio","risposta":"A","feedback":"Assemblare significa montare insieme vari componenti: qui, tubo e flangia.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Viene valutata la presenza di residui oleosi dovuti alle lavorazioni precedenti che potrebbero inficiare la corretta esecuzione della saldatura.» Nel brano, che cosa significa «inficiare»?","A":"Rendere meno valido, compromettere","B":"Rafforzare","C":"Annunciare","D":"Misurare","risposta":"A","feedback":"Inficiare vuol dire togliere validità: i residui di olio comprometterebbero la saldatura.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In presenza di residui la flangia viene deviata, mediante una paletta installata su un attuatore rotante, dalla linea principale verso una linea secondaria.» Nel brano, che cosa significa «deviata»?","A":"Fermata","B":"Fatta cambiare direzione","C":"Distrutta","D":"Lavata","risposta":"B","feedback":"Deviare significa far uscire dal percorso normale: la flangia sporca viene instradata verso la linea di lavaggio.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La flangia viene sgrassata e poi lavata con un getto d'acqua ad alta pressione e successivamente asciugata in un forno ad aria calda per poi essere riportata verso la linea 1.» Nel brano, che cosa significa «sgrassata»?","A":"Privata dei residui di grasso","B":"Ingrassata","C":"Tagliata","D":"Misurata","risposta":"A","feedback":"Il prefisso «s-» indica rimozione: si elimina il grasso o l'olio dalla superficie.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Agli ingressi della stazione di saldatura sono collocati opportuni sensori che rilevano la presenza di entrambi i pezzi da saldare e consentono l'avvio del processo.» Che cosa si può dedurre?","A":"Il processo parte solo se entrambi i pezzi sono presenti","B":"Il processo parte con un solo pezzo","C":"I sensori fermano il processo","D":"Il processo parte sempre","risposta":"A","feedback":"I sensori «consentono l'avvio» rilevando entrambi i pezzi: la presenza di tutti e due è condizione per saldare.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La smart camera riceve un segnale di sincronismo proveniente da un sensore posizionato a una certa distanza dal centro ottico; trascorsi 3 secondi la camera acquisisce l'immagine.» Perché si attende il ritardo di 3 secondi?","A":"Perché la flangia deve arrivare al centro del campo visivo","B":"Perché la camera si deve riscaldare","C":"Perché il sensore è lento","D":"Perché l'immagine è lunga","risposta":"A","feedback":"Il sensore sta a monte della camera: il tempo indicato è quello che la flangia impiega a raggiungere il centro del campo visivo.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La smart camera produce sulla sua linea di uscita un segnale digitale OK/KO a livello alto nel caso che il manufatto sia pulito; il segnale a livello alto permane per due secondi.» Nel brano, che cosa significa «permane»?","A":"Resta, dura","B":"Scompare","C":"Cambia","D":"Si ripete","risposta":"A","feedback":"Permanere vuol dire rimanere nello stesso stato: il segnale resta alto per due secondi.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il manufatto deve sostare all'interno del tunnel finché l'umidità relativa misurata rimane superiore al 10%.» Quando può uscire il manufatto?","A":"Quando l'umidità scende al 10% o sotto","B":"Quando l'umidità sale oltre il 10%","C":"Dopo un tempo fisso","D":"Subito","risposta":"A","feedback":"«Finché» indica la durata della condizione: appena l'umidità non è più superiore al 10%, la sosta termina.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'elemento riscaldante è una lampada a infrarossi, comandata in modalità diretta attraverso un relè di potenza.» Nel brano, che cosa significa «in modalità diretta»?","A":"Senza dispositivi intermedi di regolazione, con comando semplice","B":"Con un regolatore complesso","C":"A distanza","D":"A intermittenza","risposta":"A","feedback":"Il controllore agisce direttamente sul relè che alimenta la lampada, senza passaggi intermedi di regolazione.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Un regolatore stand-alone provvede a mantenere costante il livello dell'acqua presente nel serbatoio.» Nel brano, che cosa significa «stand-alone»?","A":"Autonomo, che funziona da solo","B":"Collegato a una rete","C":"Rotto","D":"Molto piccolo","risposta":"A","feedback":"Stand-alone è un anglicismo che indica un dispositivo indipendente da altri sistemi.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La portata in ingresso al serbatoio, detta afflusso, è data dalla posizione della valvola, e la portata in uscita, detta deflusso, dal flusso attraverso la pompa.» Che cosa indica «deflusso»?","A":"L'acqua che esce dal serbatoio","B":"L'acqua che entra","C":"Il livello","D":"La pressione","risposta":"A","feedback":"Il prefisso «de-» indica allontanamento: il deflusso è l'uscita del liquido.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il prodotto finito viene spostato mediante un cilindro a comando elettro-pneumatico dal nastro di uscita verso la stazione di controllo, dove un'ispezione con raggi X verifica il livello qualitativo delle saldature.» Nel brano, che cosa significa «livello qualitativo»?","A":"La quantità di pezzi","B":"Il grado di qualità","C":"Il prezzo","D":"La velocità","risposta":"B","feedback":"Qualitativo si riferisce alla qualità: l'ispezione controlla se le saldature sono ben fatte.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Un processo produttivo realizzato da tre macchine è coordinato da un unico PLC; il collegamento tra le apparecchiature avviene per mezzo di un bus di campo su base Ethernet.» Nel brano, che cosa significa «su base Ethernet»?","A":"Costruito sulla tecnologia di rete Ethernet","B":"Poggiato su una base fisica","C":"Con tre macchine","D":"Senza cavi","risposta":"A","feedback":"L'espressione indica che il bus utilizza come fondamento tecnico lo standard Ethernet.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato discuta sulle peculiarità della tecnologia del bus di campo, soffermandosi sulle funzionalità dei blocchi switch e periferia decentrata.» Nel brano, che cosa significa «peculiarità»?","A":"Difetti","B":"Caratteristiche specifiche","C":"Costi","D":"Dimensioni","risposta":"B","feedback":"Le peculiarità sono i tratti distintivi di una tecnologia, ciò che la rende particolare.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il reattore è inserito in un sistema di controllo a controreazione; il candidato determini per quali valori del guadagno il sistema può ritenersi stabile.» Nel brano, che cosa significa «può ritenersi stabile»?","A":"Può essere considerato stabile","B":"Deve essere distrutto","C":"È già instabile","D":"Non è valutabile","risposta":"A","feedback":"«Ritenersi» ha il senso di essere considerato: si cercano i valori per cui il sistema risulta stabile.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, dopo aver chiarito il concetto di protocollo di comunicazione, ne descriva almeno due utilizzati in ambito industriale, facendo anche riferimento a relativi esempi di impiego.» Che cosa gli si chiede?","A":"Descrivere due o più protocolli con esempi d'uso","B":"Descriverne uno solo","C":"Evitare gli esempi","D":"Inventare un nuovo protocollo","risposta":"A","feedback":"«Almeno due» indica un minimo e «esempi di impiego» richiede casi concreti d'uso.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, fatte le opportune ipotesi aggiuntive ritenute necessarie, rappresenti lo schema a blocchi dell'intero sistema evidenziando i dispositivi coinvolti e le relative connessioni.» Nel brano, che cosa significa «coinvolti»?","A":"Che partecipano al funzionamento","B":"Che sono danneggiati","C":"Che sono esclusi","D":"Che sono nuovi","risposta":"A","feedback":"I dispositivi coinvolti sono quelli che prendono parte al processo e vanno indicati nello schema.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato rappresenti l'algoritmo che permetta di gestire il trasporto della flangia dall'ingresso dell'impianto fino al conferimento alla stazione di saldatura.» Nel brano, che cosa significa «conferimento»?","A":"La consegna del pezzo alla stazione","B":"La conferenza","C":"Il rifiuto","D":"La misura","risposta":"A","feedback":"Conferire significa consegnare: la flangia viene portata e affidata alla stazione di saldatura.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il termostampaggio a iniezione è un processo di produzione industriale in cui un materiale plastico viene fuso e iniettato ad elevata pressione all'interno di uno stampo chiuso; dopo la solidificazione del materiale, lo stampo viene aperto al fine di permettere la raccolta del manufatto.» Nel brano, che cosa significa «manufatto»?","A":"Il macchinario che produce la plastica","B":"L'oggetto prodotto con il processo di lavorazione","C":"Lo stampo","D":"Il granulo di plastica","risposta":"B","feedback":"Il manufatto è l'oggetto ottenuto dalla lavorazione: qui il pezzo di plastica che si raccoglie quando lo stampo si apre.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «I granuli di plastica grezza sono accumulati nella tramoggia dell'unità di plastificazione.» Nel brano, che cosa significa «grezza»?","A":"Già colorata","B":"Non ancora lavorata","C":"Molto costosa","D":"Riciclata","risposta":"B","feedback":"«Grezzo» si dice di un materiale allo stato naturale o di partenza, non ancora trasformato dalla lavorazione.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Durante il percorso, a causa della temperatura interna al cilindro e al calore sviluppato dagli attriti, i granuli fondono.» Nel brano, che cosa significa «fondono»?","A":"Si uniscono con la colla","B":"Si indurisce","C":"Passano dallo stato solido a quello liquido","D":"Evaporano","risposta":"C","feedback":"Fondere significa diventare liquido per effetto del calore: i granuli solidi si trasformano in plastica fusa.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Man mano che la plastica fusa oltrepassa il puntale, la vite, libera di traslare orizzontalmente, arretra.» Nel brano, che cosa significa «traslare»?","A":"Ruotare su se stessa","B":"Spostarsi in linea retta senza ruotare","C":"Spezzarsi","D":"Riscaldarsi","risposta":"B","feedback":"Traslare indica uno spostamento da un punto a un altro lungo una direzione: la vite scorre in orizzontale all'indietro.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Man mano che la plastica fusa oltrepassa il puntale, la vite arretra.» Nel brano, che cosa significa «man mano che»?","A":"Con le mani","B":"Progressivamente, via via che","C":"Prima che","D":"Anche se","risposta":"B","feedback":"L'espressione indica due fatti che procedono insieme: più plastica passa, più la vite arretra.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Lo stampo è a temperatura molto più bassa rispetto a quella del materiale e, pertanto, inizia un processo di raffreddamento che dura qualche secondo.» Nel brano, che cosa significa «pertanto»?","A":"Perciò, di conseguenza","B":"Tuttavia","C":"Inoltre","D":"Prima di tutto","risposta":"A","feedback":"«Pertanto» introduce una conseguenza: poiché lo stampo è più freddo, il materiale si raffredda.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Una sistema di espulsione meccanico effettua il distacco del prodotto che viene convogliato su un nastro trasportatore.» Nel brano, che cosa significa «distacco»?","A":"L'unione","B":"La separazione del pezzo dallo stampo","C":"Il riscaldamento","D":"Il peso","risposta":"B","feedback":"Il distacco è l'atto di staccare: il pezzo solidificato viene separato dallo stampo.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In base alla misura, alla forma e alla complessità del prodotto, il processo di stampaggio può durare da pochi secondi a qualche minuto.» Nel brano, che cosa significa «in base a»?","A":"A prescindere da","B":"A seconda di, in funzione di","C":"Contro","D":"Dopo","risposta":"B","feedback":"L'espressione indica che la durata dipende dalle caratteristiche del prodotto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il processo si avvia a seguito della pressione di un pulsante purché nella tramoggia sia presente una sufficiente quantità di plastica grezza.» Nel brano, che cosa significa «purché»?","A":"Perché","B":"A condizione che","C":"Sebbene","D":"Dopo che","risposta":"B","feedback":"«Purché» introduce una condizione necessaria: senza plastica sufficiente il processo non parte.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Opportune lampade di segnalazione si attivano qualora le due condizioni non dovessero essere verificate.» Nel brano, che cosa significa «verificate»?","A":"Controllate a posteriori","B":"Soddisfatte, realizzate","C":"Misurate","D":"Interrotte","risposta":"B","feedback":"Qui «verificarsi» indica l'accadere delle condizioni: le lampade si accendono se quelle condizioni non sono rispettate.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il finecorsa B è opportunamente posizionato in funzione della quantità di materiale che deve essere iniettato.» Nel brano, che cosa significa «in funzione di»?","A":"Al posto di","B":"A seconda di","C":"Senza considerare","D":"Dopo","risposta":"B","feedback":"La posizione del finecorsa dipende dalla quantità di materiale da iniettare.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La commutazione del finecorsa A segnala che la vite ha completato il suo percorso e che tutto il fluido è passato nello stampo.» Nel brano, che cosa significa «segnala»?","A":"Nasconde","B":"Fa sapere, indica","C":"Blocca","D":"Contraddice","risposta":"B","feedback":"Segnalare significa comunicare un'informazione: il finecorsa indica che l'iniezione è terminata.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Da questo momento trascorre un tempo di cinque secondi per consentire il raffreddamento e la solidificazione della plastica nello stampo; dopodiché la pressa viene disattivata.» Nel brano, che cosa significa «dopodiché»?","A":"Dopo di che, in seguito","B":"Prima di tutto","C":"Nonostante","D":"Perciò","risposta":"A","feedback":"«Dopodiché» segna la successione temporale: la pressa si disattiva dopo i cinque secondi.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il processo di metallizzazione sotto vuoto consente di ottenere una finitura lucida e riflettente su una vasta gamma di materiali quali plastica, vetro e ceramica.» Nel brano, che cosa significa «riflettente»?","A":"Che assorbe la luce","B":"Che rimanda la luce come uno specchio","C":"Che è trasparente","D":"Che è opaco","risposta":"B","feedback":"Una superficie riflettente rimanda la luce che riceve, dando un aspetto brillante.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'alluminio, sottoposto ad alta temperatura in una camera a vuoto, vaporizza rilasciando atomi liberi di muoversi senza l'ostacolo dell'aria.» Nel brano, che cosa significa «vaporizza»?","A":"Si solidifica","B":"Si trasforma in vapore","C":"Si ossida","D":"Si raffredda","risposta":"B","feedback":"Vaporizzare è il passaggio allo stato di vapore: l'alluminio riscaldato libera atomi nella camera.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Gli atomi, entrando in contatto con le superfici più fredde dei pezzi, aderiscono formando uno strato sottile e uniforme.» Nel brano, che cosa significa «uniforme»?","A":"Irregolare","B":"Di spessore uguale su tutta la superficie","C":"Molto spesso","D":"Colorato","risposta":"B","feedback":"Uniforme vuol dire omogeneo: lo strato ha lo stesso spessore in ogni punto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il processo è realizzato mediante una camera sottovuoto, una fonte di calore e dei telai portapezzi, tecnicamente definiti satelliti, dove vengono appesi gli oggetti da metallizzare.» Nel brano, che cosa sono i «satelliti»?","A":"Strumenti per le telecomunicazioni","B":"Telai a cui si appendono i pezzi da trattare","C":"Sensori di pressione","D":"Pompe a vuoto","risposta":"B","feedback":"Il testo stesso chiarisce che «satelliti» è il termine tecnico per i telai portapezzi.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Gli oggetti da metallizzare, il cui numero è preventivamente impostato attraverso un pannello operatore, sono prelevati manualmente da un magazzino.» Nel brano, che cosa significa «preventivamente»?","A":"In anticipo, prima dell'inizio","B":"Con un preventivo di spesa","C":"Dopo il processo","D":"Casualmente","risposta":"A","feedback":"Preventivamente indica che l'operazione è fatta prima: il numero di oggetti viene impostato prima di iniziare.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il nastro si avvia per poi arrestarsi quando il primo oggetto viene rilevato da una fotocellula; contemporaneamente il portello della camera viene aperto.» Nel brano, che cosa significa «contemporaneamente»?","A":"In seguito","B":"Nello stesso momento","C":"Mai","D":"Prima","risposta":"B","feedback":"Contemporaneamente indica la simultaneità: nastro che si ferma e portello che si apre avvengono insieme.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Una volta occupate tutte le posizioni di un satellite, l'operatore, premendo un pulsante, attiva la rotazione della tavola cosicché il satellite successivo si allinei al portello.» Nel brano, che cosa significa «si allinei»?","A":"Si disponga in corrispondenza, sulla stessa linea","B":"Si spezzi","C":"Si scaldi","D":"Si fermi lontano","risposta":"A","feedback":"Allinearsi significa mettersi in linea: il satellite si pone di fronte al portello.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Ristabilite le condizioni di pressione all'interno della camera, automaticamente il portello si apre per consentire l'estrazione degli oggetti.» Nel brano, che cosa significa «ristabilite»?","A":"Cancellate","B":"Riportate al valore normale","C":"Peggiorate","D":"Misurate","risposta":"B","feedback":"Ristabilire vuol dire ripristinare: la pressione torna al valore ordinario e il portello può aprirsi.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Un impianto fermo per manutenzione o guasto genera perdite di produttività e possibili ritardi sulla programmazione.» Nel brano, che cosa significa «guasto»?","A":"Un malfunzionamento che impedisce l'uso","B":"Un controllo programmato","C":"Un aumento di produzione","D":"Un collaudo","risposta":"A","feedback":"Il guasto è un'avaria improvvisa che interrompe il funzionamento regolare dell'impianto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Nelle applicazioni industriali sono utilizzati frequentemente segnali in corrente per la trasmissione di informazioni verso il controllore di processo.» Nel brano, che cosa significa «frequentemente»?","A":"Raramente","B":"Molto spesso","C":"Mai","D":"Una volta","risposta":"B","feedback":"Frequentemente è l'avverbio di «frequente»: indica un uso ricorrente.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La normativa sulla sicurezza richiede che l'azienda effettui la valutazione dei rischi connessi al proprio processo produttivo.» Nel brano, che cosa significa «connessi»?","A":"Collegati, legati","B":"Lontani","C":"Eliminati","D":"Ignorati","risposta":"A","feedback":"I rischi connessi sono quelli legati al processo produttivo, cioè che ne derivano.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, dopo aver chiarito il concetto di rischio, esponga quali sono le parti essenziali che devono comparire nel documento.» Nel brano, che cosa significa «essenziali»?","A":"Facoltative","B":"Indispensabili","C":"Secondarie","D":"Lunghe","risposta":"B","feedback":"Essenziale si dice di ciò che non può mancare, perché fondamentale.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Nel processo di stampaggio è necessario monitorare l'andamento della pressione nella cavità di stampo.» Nel brano, che cosa significa «monitorare»?","A":"Ignorare","B":"Tenere sotto controllo osservando nel tempo","C":"Ridurre","D":"Interrompere","risposta":"B","feedback":"Monitorare significa osservare con continuità una grandezza per seguirne le variazioni.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sensore piezoelettrico e una termocoppia sono inglobati in un unico contenitore e opportunamente installati.» Nel brano, che cosa significa «inglobati»?","A":"Racchiusi insieme in un unico corpo","B":"Separati","C":"Distrutti","D":"Sovrapposti a caso","risposta":"A","feedback":"Inglobare significa includere dentro un insieme: i due sensori condividono lo stesso involucro.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il processo si avvia a seguito della pressione di un pulsante; a processo avviato entra in funzione un motore che comanda la rotazione della vite; questa fase si conclude quando la vite arretra fino al finecorsa B.» A che cosa si riferisce «questa fase»?","A":"Alla chiusura dello stampo","B":"Alla plastificazione, cioè la rotazione della vite","C":"Al raffreddamento","D":"All'espulsione","risposta":"B","feedback":"Il pronome richiama la fase appena descritta: la rotazione della vite che fonde e accumula la plastica.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La vite fine viene spinta in avanti dal pistone oleodinamico, con conseguente aumento della pressione, fino a raggiungere un livello tale da provocare l'apertura dell'ugello.» Che cosa si può dedurre?","A":"L'ugello si apre solo quando la pressione ha raggiunto un valore sufficiente","B":"L'ugello è sempre aperto","C":"La pressione diminuisce","D":"L'ugello si apre prima dell'iniezione","risposta":"A","feedback":"L'espressione «livello tale da» indica una soglia: raggiunta la pressione necessaria, l'ugello si apre e il fluido passa.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Durante questa fase l'ugello è chiuso; man mano che la plastica fusa oltrepassa il puntale, la vite arretra a causa della stessa spinta esercitata dal materiale.» Che cosa causa l'arretramento della vite?","A":"Un motore che la tira indietro","B":"La pressione del materiale accumulato davanti alla vite","C":"Il calore","D":"Il comando dell'operatore","risposta":"B","feedback":"Il testo dice che l'arretramento deriva dalla spinta del materiale stesso, che si accumula davanti alla vite.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'attivazione della pressa è comandata mediante un'elettrovalvola monostabile; l'avvenuta chiusura dello stampo è segnalata dall'attivazione di un apposito sensore.» Nel brano, che cosa significa «l'avvenuta chiusura»?","A":"La chiusura che sta per avvenire","B":"La chiusura già compiuta","C":"La mancata chiusura","D":"L'apertura","risposta":"B","feedback":"Il participio «avvenuta» indica un fatto già accaduto: il sensore conferma che lo stampo è chiuso.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La pressa viene disattivata e questo determina l'allontanamento dello stampo con la conseguente caduta dei pezzi prodotti sullo scivolo.» Nel brano, che cosa significa «determina»?","A":"Stabilisce con un calcolo","B":"Provoca come effetto","C":"Impedisce","D":"Descrive","risposta":"B","feedback":"Qui «determinare» vale causare: la disattivazione della pressa ha come effetto l'allontanamento dello stampo.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La fonte di calore è un filamento di alluminio che, percorso da corrente elevata, si riscalda fino a vaporizzare.» Nel brano, che cosa significa «percorso da corrente»?","A":"Attraversato dal passaggio di corrente","B":"Sorpassato da un corridore","C":"Rotto dalla corrente","D":"Spento dalla corrente","risposta":"A","feedback":"Il filamento è attraversato dalla corrente elettrica, che lo riscalda per effetto Joule.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'alluminio inizia a vaporizzare e il rilascio degli atomi del metallo determina un aumento della pressione pari almeno al 5% rispetto a quella misurata prima dell'inizio della vaporizzazione.» Nel brano, che cosa significa «almeno»?","A":"Al massimo","B":"Come valore minimo","C":"Esattamente","D":"Mai","risposta":"B","feedback":"«Almeno» fissa un limite inferiore: l'aumento deve essere del 5% o di più.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Trascorsi 5 minuti da quando si è registrato l'aumento di pressione il processo si conclude.» Da quale momento si conta il tempo?","A":"Dall'avvio della pompa","B":"Dall'istante in cui si rileva l'aumento di pressione","C":"Dalla chiusura del portello","D":"Dalla pressione del pulsante","risposta":"B","feedback":"Il testo fissa il punto di partenza: l'istante in cui è stato registrato l'aumento di pressione dovuto alla vaporizzazione.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La tavola ruota e con essa i satelliti intorno al proprio asse, affinché gli atomi di alluminio vaporizzato ricoprano uniformemente le superfici degli oggetti.» Qual è lo scopo della rotazione?","A":"Raffreddare i pezzi","B":"Distribuire il metallo in modo omogeneo sui pezzi","C":"Pulire la camera","D":"Aprire il portello","risposta":"B","feedback":"«Affinché» introduce lo scopo: la rotazione espone ogni parte dei pezzi agli atomi e rende il rivestimento uniforme.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sensore Pirani ha un range di tensione in uscita 0,5…8,5 V, con 1 V per decade.» Nel brano, che cosa significa «range»?","A":"Il valore medio","B":"L'intervallo di valori possibili","C":"Il costo","D":"La precisione","risposta":"B","feedback":"Range è un anglicismo tecnico che indica l'intervallo tra il valore minimo e quello massimo.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In corrispondenza del portello, alla base della tavola rotante, è installato un finecorsa per rilevare il posizionamento di ciascun satellite.» Nel brano, che cosa significa «ciascun»?","A":"Solo il primo","B":"Ognuno, preso singolarmente","C":"Nessuno","D":"Un altro","risposta":"B","feedback":"«Ciascuno» indica ogni elemento di un insieme considerato uno per volta.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il processo si avvia purché nella tramoggia sia presente una sufficiente quantità di plastica e la temperatura sia compresa nel range 260-280 gradi; opportune lampade si attivano qualora le due condizioni non dovessero essere verificate.» Che cosa si può dedurre?","A":"Le lampade segnalano che il processo non può partire perché manca una condizione","B":"Le lampade si accendono quando tutto è regolare","C":"Il processo parte comunque","D":"Le lampade misurano la temperatura","risposta":"A","feedback":"Le lampade avvisano l'operatore quando una delle due condizioni di avvio non è soddisfatta.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Al fine di rendere completamente automatico il funzionamento della macchina si introduce una modifica eliminando il finecorsa B, che necessita dell'intervento di un operatore per il suo posizionamento.» Nel brano, che cosa significa «necessita di»?","A":"Ha bisogno di","B":"Ha eliminato","C":"Ha prodotto","D":"Evita","risposta":"A","feedback":"Necessitare di significa richiedere: il finecorsa B richiede l'intervento manuale, che si vuole eliminare.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato discuta le considerazioni da fare per consentire la corretta gestione del segnale impulsivo proveniente dal dispositivo.» Nel brano, che cosa significa «impulsivo»?","A":"Che agisce senza riflettere","B":"Costituito da impulsi, cioè brevi variazioni del segnale","C":"Molto forte","D":"Continuo e costante","risposta":"B","feedback":"In ambito tecnico un segnale impulsivo è formato da impulsi, cioè brevi variazioni di livello.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Con riferimento alla prima parte della traccia, al fine di migliorare la produttività dell'impianto si desidera automatizzare il processo di finitura avvalendosi di un manipolatore.» Nel brano, che cosa significa «avvalendosi di»?","A":"Servendosi di","B":"Rinunciando a","C":"Dubitando di","D":"Sostituendo","risposta":"A","feedback":"Avvalersi di qualcosa significa utilizzarlo come mezzo: il processo sarà svolto con l'aiuto di un manipolatore.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Per effettuare l'automatizzazione l'estrattore meccanico è stato eliminato e quindi i pezzi non cadono.» Che cosa si può dedurre?","A":"I pezzi restano sullo stampo e vanno prelevati da un altro sistema","B":"I pezzi cadono più velocemente","C":"I pezzi si rompono","D":"Lo stampo non si apre","risposta":"A","feedback":"Senza estrattore i pezzi non si staccano da soli: serve un manipolatore che li prelevi.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato proponga una soluzione che risolva efficacemente i problemi derivanti dalla presenza di disturbi elettromagnetici sovrapposti ai segnali utili.» Nel brano, che cosa significa «sovrapposti»?","A":"Sommati al segnale, mescolati con esso","B":"Sostituiti","C":"Spenti","D":"Amplificati dal sensore","risposta":"A","feedback":"I disturbi si sommano al segnale utile e ne alterano la forma, rendendo difficile la lettura.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'inverter può essere configurato dall'operatore per mezzo del tastierino a disposizione sull'apparecchio.» Nel brano, che cosa significa «configurato»?","A":"Impostato secondo i parametri voluti","B":"Distrutto","C":"Verniciato","D":"Venduto","risposta":"A","feedback":"Configurare un dispositivo significa regolarne i parametri in modo che funzioni come desiderato.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'azionamento sarà installato in una macchina destinata al mercato europeo.» Nel brano, che cosa significa «destinata a»?","A":"Proveniente da","B":"Prevista per essere usata in","C":"Rifiutata da","D":"Rubata a","risposta":"B","feedback":"Destinato a indica lo scopo o il luogo d'uso: la macchina verrà venduta e usata in Europa.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Sta sempre più prendendo piede la manutenzione predittiva.» Nel brano, che cosa significa «prendendo piede»?","A":"Calpestando","B":"Diffondendosi, affermandosi","C":"Scomparendo","D":"Rallentando","risposta":"B","feedback":"«Prendere piede» è un'espressione figurata: indica che qualcosa si sta diffondendo e consolidando.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato definisca che cosa si intende per manutenzione predittiva, evidenziandone i pregi rispetto ad altri metodi utilizzati.» Nel brano, che cosa significa «pregi»?","A":"Difetti","B":"Qualità positive, vantaggi","C":"Costi","D":"Tempi","risposta":"B","feedback":"I pregi sono gli aspetti favorevoli: il candidato deve mostrare perché la manutenzione predittiva è preferibile.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato illustri le principali caratteristiche di tali segnali rispetto a quelli in tensione, descrivendo vantaggi e svantaggi.» Nel brano, che cosa significa «rispetto a»?","A":"In confronto a","B":"A causa di","C":"Prima di","D":"Insieme a","risposta":"A","feedback":"Qui «rispetto a» introduce un paragone: i segnali in corrente vanno confrontati con quelli in tensione.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Una volta occupate tutte le posizioni di un satellite, l'operatore attiva la rotazione della tavola; quando tutti gli oggetti sono stati caricati si accende una lampada e l'operatore comanda la chiusura del portello.» Quale ordine seguono gli eventi?","A":"Chiusura, poi caricamento","B":"Caricamento dei satelliti, accensione della lampada, chiusura del portello","C":"Accensione della lampada, poi rotazione","D":"Rotazione, poi apertura del portello","risposta":"B","feedback":"Il brano stabilisce la sequenza: prima il caricamento completo, poi la segnalazione e solo dopo la chiusura.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il processo viene realizzato mediante una camera sottovuoto: la camera è chiusa e una pompa a vuoto viene attivata al fine di raggiungere una pressione molto bassa.» Che cosa significa «sottovuoto»?","A":"In condizioni di pressione molto ridotta, quasi priva di aria","B":"Sotto il livello del suolo","C":"In pieno vuoto di memoria","D":"Con molta aria compressa","risposta":"A","feedback":"Un ambiente sottovuoto ha pochissima aria: gli atomi di alluminio possono muoversi senza ostacoli.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Al fine di migliorare la produttività e la sicurezza dell'impianto, si desidera automatizzare il processo di carico e scarico degli oggetti sui satelliti avvalendosi di un sistema robotizzato.» Perché si automatizza il carico e scarico, secondo il brano?","A":"Per ridurre i costi dei satelliti","B":"Per produrre di più e rendere più sicuro l'impianto","C":"Per rallentare il processo","D":"Per eliminare i satelliti","risposta":"B","feedback":"«Al fine di» introduce la finalità: migliorare produttività e sicurezza.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato individui la catena cinematica di un manipolatore in grado di raggiungere con il centro flangia i tappeti dei nastri e le otto estremità del satellite.» Nel brano, che cosa significa «in grado di»?","A":"Capace di","B":"Incapace di","C":"Obbligato a","D":"Proibito di","risposta":"A","feedback":"«Essere in grado di» significa avere la capacità di fare qualcosa.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Una parte dello schema elettrico è rappresentata in figura: il candidato individui e rappresenti la parte mancante, al fine di ottenere il funzionamento previsto nel diagramma di temporizzazione.» Nel brano, che cosa significa «previsto»?","A":"Indovinato","B":"Stabilito dalle specifiche, atteso","C":"Impossibile","D":"Passato","risposta":"B","feedback":"Il funzionamento previsto è quello descritto dalle specifiche e rappresentato nel diagramma di temporizzazione.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, dopo aver motivato la presenza della sezione di circuito evidenziata e descritto il funzionamento, definisca il range di tensione da applicare.» Nel brano, che cosa significa «motivato la presenza»?","A":"Spiegato per quale ragione è presente","B":"Eliminato","C":"Disegnato","D":"Misurato","risposta":"A","feedback":"Motivare significa fornire le ragioni: qui, perché quella parte del circuito è necessaria.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'albero della tavola rotante è azionato da un motoriduttore asincrono trifase; la coppia massima necessaria per far ruotare la tavola è pari a 130 Nm.» Che cosa indica «coppia massima necessaria»?","A":"Il valore più alto di sforzo che il motore deve poter sviluppare","B":"Il valore minimo","C":"La velocità","D":"La tensione","risposta":"A","feedback":"Il testo fornisce il limite superiore dello sforzo richiesto: il motoriduttore deve essere in grado di fornirlo.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Durante la fase di metallizzazione la tavola gira a 40 giri al minuto con una tolleranza del 15 per cento.» Nel brano, che cosa significa «tolleranza»?","A":"La capacità di sopportare il dolore","B":"Lo scarto ammesso rispetto al valore nominale","C":"La velocità minima","D":"L'errore di costruzione","risposta":"B","feedback":"La tolleranza è la variazione accettabile: la velocità può oscillare entro il 15% rispetto a 40 giri al minuto.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La temperatura di fusione del materiale è pari a 270 gradi; il sistema di riscaldamento è controllato mediante una regolazione di tipo ON-OFF, costituito da elementi conduttivi alimentati a corrente alternata.» Nel brano, che cosa indica «regolazione di tipo ON-OFF»?","A":"Una regolazione continua e graduale","B":"Una regolazione che alterna due soli stati, acceso e spento","C":"Una regolazione manuale","D":"Una regolazione a pedale","risposta":"B","feedback":"Il termine indica un controllo a due soli livelli: il riscaldatore si accende o si spegne in base alla temperatura.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il pistone oleodinamico adibito a movimentare in orizzontale la vite senza fine durante l'iniezione è comandato mediante un'elettrovalvola monostabile.» Nel brano, che cosa significa «adibito a»?","A":"Destinato a svolgere una funzione","B":"Costruito con","C":"Proibito di","D":"Sostituito da","risposta":"A","feedback":"Adibito a indica l'uso a cui qualcosa è destinato: il pistone serve a spostare la vite.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La vite senza fine viene messa in rotazione provocando l'ingresso dei granuli in un cilindro riscaldato e il loro avanzamento verso l'ugello; i granuli fondono.» Quale ordine seguono gli eventi?","A":"Fusione, rotazione, ingresso","B":"Rotazione, ingresso e avanzamento, fusione","C":"Avanzamento, ingresso, rotazione","D":"Fusione, avanzamento, ingresso","risposta":"B","feedback":"La rotazione della vite provoca l'ingresso e l'avanzamento dei granuli, che durante il percorso fondono.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Tra puntale e ugello si accumula la quantità di plastica fusa necessaria per la produzione del manufatto: si arresta la rotazione della vite e di conseguenza anche il suo arretramento.» Che cosa significa «di conseguenza»?","A":"Come effetto di quanto detto","B":"In contrasto con","C":"Prima di","D":"Nonostante","risposta":"A","feedback":"Fermata la rotazione, non entra più materiale e perciò anche l'arretramento si ferma: è una relazione di causa-effetto.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Un impianto fermo genera perdite di produttività. Per affrontare efficacemente queste situazioni sta prendendo piede la manutenzione predittiva, che interviene prima del guasto sulla base dei dati raccolti.» Che cosa si può dedurre?","A":"Si interviene solo dopo la rottura","B":"I dati raccolti permettono di prevedere i guasti e di evitare fermi imprevisti","C":"La manutenzione non serve","D":"I dati non servono","risposta":"B","feedback":"La manutenzione predittiva sfrutta le informazioni misurate per anticipare i guasti e ridurre le interruzioni.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato dopo aver chiarito il concetto di rischio esponga quali sono le parti essenziali del documento e quali sono le figure responsabili della sua redazione.» Nel brano, che cosa significa «redazione»?","A":"Stesura scritta del documento","B":"Lettura ad alta voce","C":"Archiviazione","D":"Traduzione","risposta":"A","feedback":"La redazione di un documento è l'atto di scriverlo e comporlo nella forma definitiva.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato disegni il circuito che permette di interfacciare un sensore di pressione a un controllore che dispone di un unico ingresso analogico in tensione riferito a massa e impedenza di ingresso non inferiore a 100 kΩ.» Che cosa significa «dispone di»?","A":"Ha a disposizione, possiede","B":"Rinuncia a","C":"Necessita di","D":"Elimina","risposta":"A","feedback":"Disporre di indica il possesso: il controllore ha un solo ingresso analogico, e questo vincola la soluzione.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato determini la pressione misurata dal sensore qualora il valore numerico generato dal convertitore sia pari a 3560.» Nel brano, che cosa significa «sia pari a»?","A":"Sia uguale a","B":"Sia maggiore di","C":"Sia diverso da","D":"Sia minore di","risposta":"A","feedback":"Essere pari a significa avere lo stesso valore: il convertitore fornisce proprio 3560.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'inverter può essere configurato dall'operatore per mezzo del tastierino. Il candidato definisca la sequenza di operazioni da eseguire per configurare correttamente l'accoppiamento inverter-motore.» Nel brano, che cosa significa «sequenza»?","A":"Una successione ordinata di passi","B":"Un elenco di prezzi","C":"Un guasto","D":"Una scelta casuale","risposta":"A","feedback":"Una sequenza è un insieme di operazioni da eseguire in un ordine preciso.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato proponga una soluzione che consenta di monitorare graficamente su personal computer gli andamenti delle grandezze fisiche mediante strumentazione virtuale.» Nel brano, che cosa significa «consenta»?","A":"Renda possibile","B":"Impedisca","C":"Imponga","D":"Ritardi","risposta":"A","feedback":"Consentire significa permettere: la soluzione deve rendere possibile la visualizzazione grafica.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato individui la struttura cinematica di un manipolatore, motivando le scelte fatte, e determini le lunghezze dei singoli bracci.» Che cosa significa «motivando le scelte fatte»?","A":"Giustificando le decisioni prese","B":"Cambiando idea","C":"Ripetendo il testo","D":"Nascondendo i calcoli","risposta":"A","feedback":"Motivare le scelte vuol dire spiegare le ragioni tecniche che hanno portato alla decisione.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Nell'ipotesi che sia disponibile un utensile in grado di effettuare il prelievo di tutti i pezzi contemporaneamente, il candidato individui la struttura di un manipolatore.» Che cosa significa «nell'ipotesi che»?","A":"Supponendo che","B":"A meno che non","C":"Nonostante","D":"Poiché è certo che","risposta":"A","feedback":"L'espressione introduce una supposizione: la soluzione va studiata partendo dal presupposto dell'utensile multiplo.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'alluminio vaporizza rilasciando atomi liberi di muoversi senza l'ostacolo dell'aria; gli atomi, entrando in contatto con le superfici più fredde, aderiscono.» Perché le superfici devono essere più fredde del vapore?","A":"Perché il vapore si solidifica a contatto con una superficie a temperatura inferiore","B":"Perché il freddo attira gli atomi","C":"Perché l'aria è fredda","D":"Perché il vuoto è freddo","risposta":"A","feedback":"Il testo suggerisce che il contatto con superfici più fredde fa aderire gli atomi, che si solidificano formando lo strato.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In un impianto per il confezionamento di miele, dei vasetti vuoti vengono singolarizzati, riempiti, tappati, ispezionati e infine raggruppati per l'imballaggio finale.» Nel brano, che cosa significa «singolarizzati»?","A":"Separati in modo che passino uno alla volta","B":"Contati in gruppo","C":"Lavati singolarmente","D":"Colorati in modo diverso","risposta":"A","feedback":"Singolarizzare significa isolare ogni elemento dagli altri, così che arrivi alla lavorazione un pezzo per volta. Il testo spiega che ciò avviene con stopper che trattengono il vasetto successivo.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «I vasetti vuoti, provenienti da un tavolo rotante, sono convogliati su un nastro trasportatore attivo fin dall'accensione dell'impianto.» Nel brano, che cosa significa «attivo fin dall'accensione»?","A":"Si attiva solo dopo il riempimento","B":"Funziona fin dal primo momento in cui l'impianto viene acceso","C":"Si accende a intermittenza","D":"Funziona solo di notte","risposta":"B","feedback":"«Fin da» indica il punto di partenza: il nastro si muove già nell'istante in cui l'impianto viene acceso, senza attendere altri comandi.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Quando il sensore rileva la presenza di un vasetto in posizione ottimale per il riempimento, viene comandata l'estensione dello stopper, che impedisce l'avanzamento del vasetto successivo.» Nel brano, che cosa significa «ottimale»?","A":"La migliore possibile per lo scopo","B":"Appena sufficiente","C":"La più vicina","D":"Casuale","risposta":"A","feedback":"«Ottimale» deriva da «ottimo»: indica la posizione più adatta per riempire correttamente il vasetto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Nella stazione di riempimento è presente una cella di carico, che misura il peso lordo del vasetto.» Nel brano, che cosa significa «peso lordo»?","A":"Il peso del solo contenuto","B":"Il peso sporco di residui","C":"Il peso del contenitore e del contenuto insieme","D":"Il peso del solo contenitore","risposta":"C","feedback":"Il peso lordo comprende tutto ciò che sta sulla cella: vasetto e miele. Il peso del solo contenuto si chiama netto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il vasetto riempito raggiunge la stazione di tappatura dove un'apposita macchina applica e ruota il coperchio fino alla sua chiusura.» Nel brano, che cosa significa «apposita»?","A":"Costruita per quel compito specifico","B":"Posta sopra","C":"Molto vecchia","D":"Rumorosa","risposta":"A","feedback":"«Apposito» si dice di ciò che è fatto proprio per una determinata funzione: una macchina pensata per tappare.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Una smart camera verifica «al volo« il corretto posizionamento del coperchio rispetto al vasetto.» Nel brano, che cosa significa «al volo»?","A":"Mentre il vasetto è in movimento, senza fermarlo","B":"In volo, con un drone","C":"In modo approssimativo","D":"Dopo una lunga attesa","risposta":"A","feedback":"L'espressione indica un controllo eseguito durante il passaggio, senza interrompere l'avanzamento del vasetto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «I prodotti non conformi vengono espulsi dalla linea mediante un cilindro pneumatico, mentre gli altri procedono verso il fine linea.» Nel brano, che cosa significa «non conformi»?","A":"Troppo grandi","B":"Non corrispondenti ai requisiti richiesti","C":"Già confezionati","D":"Di colore diverso","risposta":"B","feedback":"Un prodotto non conforme non rispetta le specifiche: qui, ad esempio, il coperchio posizionato male. Per questo viene scartato.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Quando tre vasetti si accumulano a fine linea, un cilindro li sposta su un nastro a rulli indirizzandoli verso una successiva stazione di imballaggio.» Nel brano, che cosa significa «indirizzandoli»?","A":"Scrivendo l'indirizzo","B":"Fermandoli","C":"Dirigendoli verso una destinazione","D":"Contandoli","risposta":"C","feedback":"Indirizzare significa far andare in una certa direzione: i vasetti vengono avviati verso la stazione di imballaggio.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La valvola è aperta al 100% fino al raggiungimento di 200 grammi di prodotto e poi al 20% fino a 250 grammi, momento in cui viene chiusa del tutto.» A che cosa si riferisce «momento in cui»?","A":"All'istante in cui il peso arriva a 250 grammi","B":"All'istante di accensione dell'impianto","C":"Ai primi 200 grammi","D":"All'apertura al 20%","risposta":"A","feedback":"L'espressione riprende «250 grammi»: è quello il momento in cui la valvola si chiude completamente.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In un impianto farmaceutico si vuole automatizzare il processo di preparazione di un determinato farmaco.» Nel brano, che cosa significa «automatizzare»?","A":"Far eseguire a macchine, senza intervento continuo dell'uomo","B":"Vendere in automatico","C":"Rendere più lento","D":"Spostare in un'altra sede","risposta":"A","feedback":"Automatizzare significa affidare a dispositivi un processo, riducendo al minimo l'intervento manuale.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il prodotto dapprima viene agitato al fine di renderlo più fluido e in seguito riscaldato per un tempo prefissato.» Nel brano, che cosa significa «prefissato»?","A":"Stabilito in precedenza","B":"Molto lungo","C":"Variabile","D":"Incerto","risposta":"A","feedback":"Il prefisso «pre-» indica anticipo: il tempo è deciso prima che il processo cominci.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il prodotto si trova in forma liquida e viene versato in due recipienti cilindrici identici.» Nel brano, che cosa significa «identici»?","A":"Molto diversi","B":"Rotti","C":"Uguali in tutto","D":"Trasparenti","risposta":"C","feedback":"Identici significa perfettamente uguali: i due contenitori hanno stessa forma e dimensioni.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Un operatore posiziona un vassoio con due recipienti vuoti sul nastro, in corrispondenza di un sensore di zero.» Nel brano, che cosa indica «sensore di zero»?","A":"Un sensore spento","B":"Un sensore che segnala la posizione di partenza","C":"Un sensore che misura la temperatura","D":"Un sensore difettoso","risposta":"B","feedback":"Lo «zero» è il punto di riferimento iniziale: il sensore indica che il vassoio si trova nella posizione da cui parte il ciclo.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Gli erogatori si abbassano fino all'imbocco dei recipienti.» Nel brano, che cosa significa «imbocco»?","A":"Il fondo","B":"L'apertura attraverso cui si entra","C":"Il coperchio","D":"La base","risposta":"B","feedback":"L'imbocco è l'apertura d'ingresso di un contenitore: gli erogatori si fermano proprio lì per versare il prodotto.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'erogazione del prodotto prosegue fino a quando il livello raggiunge il valore preimpostato manualmente dall'operatore sul pannello del regolatore.» Nel brano, che cosa sign
