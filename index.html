ifica «erogazione»?","A":"Il versamento di una quantità di prodotto","B":"L'acquisto del prodotto","C":"L'analisi del prodotto","D":"La pulizia del prodotto","risposta":"A","feedback":"Erogare significa distribuire o far uscire una sostanza: qui, il prodotto che fluisce nei recipienti.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Gli agitatori a pale vengono messi in rotazione provocando il progressivo aumento della fluidità del prodotto.» Nel brano, che cosa significa «progressivo»?","A":"Improvviso","B":"Che avviene per gradi, a poco a poco","C":"Impossibile","D":"Che avviene all'inizio","risposta":"B","feedback":"Progressivo indica un cambiamento graduale: più le pale girano, più il prodotto diventa fluido.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il vassoio viene trasportato all'interno di un forno, mantenuto a una temperatura costante, dove sosta per due minuti.» Nel brano, che cosa significa «sosta»?","A":"Si ferma per un certo tempo","B":"Si rovescia","C":"Si raffredda","D":"Si rompe","risposta":"A","feedback":"Sostare vuol dire fermarsi: il vassoio resta nel forno due minuti.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il forno è mantenuto a una temperatura costante mediante un termoregolatore.» Nel brano, che cosa significa «costante»?","A":"Che cambia di continuo","B":"Che si abbassa nel tempo","C":"Molto alta","D":"Che resta invariata","risposta":"D","feedback":"Costante si dice di ciò che non varia: il termoregolatore fa in modo che la temperatura non cambi.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il seguente pseudo-codice è caricato nell'unità di comando di un robot antropomorfo a sei assi.» Nel brano, che cosa significa «antropomorfo»?","A":"Con forma che ricorda quella umana","B":"Molto veloce","C":"Fatto di metallo","D":"Privo di sensori","risposta":"A","feedback":"Antropomorfo deriva da «uomo» e «forma»: il robot ha un braccio articolato che imita la struttura di quello umano.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La funzione permette di effettuare un movimento interpolato lineare, mentre un'altra permette di effettuare un movimento punto a punto.» Nel brano, che cosa significa «punto a punto»?","A":"Spostandosi da una posizione all'altra, senza vincolo sul tragitto","B":"Seguendo una retta obbligata","C":"Restando fermo","D":"Tracciando un cerchio","risposta":"A","feedback":"Nel movimento punto a punto conta solo il raggiungimento della posizione finale; nell'altro, invece, il percorso è una retta.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, sulla base delle proprie conoscenze e competenze, maturate anche attraverso i percorsi per le competenze trasversali e l'orientamento, ipotizzi per quale tipo di applicazione potrebbe essere stato progettato il codice.» Nel brano, che cosa significa «maturate»?","A":"Diventate vecchie","B":"Sviluppate e consolidate nel tempo","C":"Dimenticate","D":"Premiate","risposta":"B","feedback":"Maturare, riferito a competenze, significa svilupparsi con l'esperienza fino ad essere solide.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «In un'azienda sono presenti quattro reparti. Si deve configurare una rete locale secondo specifiche precise; ai dispositivi devono essere assegnati indirizzi IP statici.» Nel brano, che cosa significa «statici»?","A":"Che cambiano continuamente","B":"Che non si muovono fisicamente","C":"Fissi, assegnati una volta per tutte","D":"Temporanei","risposta":"C","feedback":"Un indirizzo statico è stabilito a mano e resta invariato, a differenza di quello dinamico assegnato di volta in volta.","difficolta":1},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Le vibrazioni sull'albero delle pale a lungo termine ne precludono l'affidabilità meccanica.» Nel brano, che cosa significa «precludono»?","A":"Migliorano","B":"Impediscono, rendono impossibile","C":"Misurano","D":"Prevedono","risposta":"B","feedback":"Precludere significa chiudere la strada a qualcosa: le vibrazioni, nel tempo, tolgono affidabilità all'albero.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Al fine di realizzare una manutenzione predittiva, le vibrazioni sono monitorate grazie a un accelerometro collegato a una scheda di acquisizione dati.» Che cosa significa «manutenzione predittiva»?","A":"Un intervento dopo il guasto","B":"Un intervento a calendario fisso","C":"Un intervento che sostituisce tutto","D":"Un intervento basato sulla previsione dei guasti grazie al monitoraggio","risposta":"D","feedback":"«Predittiva» richiama il prevedere: dai dati misurati si intuisce quando un componente rischia di guastarsi, e si interviene prima.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il controllo del riempimento prevede che la valvola sia aperta al 100% fino a 200 grammi e poi al 20% fino a 250 grammi.» Perché la valvola, a un certo punto, viene aperta solo al 20%?","A":"Perché il vasetto è pieno","B":"Perché si vuole rallentare il flusso e fermarsi con maggiore precisione sul peso finale","C":"Perché il miele è finito","D":"Perché la cella è guasta","risposta":"B","feedback":"Il testo non lo dichiara, ma lo si deduce: riducendo la portata vicino al traguardo, si evita di superare i 250 grammi.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «A riempimento completato lo stopper S2 viene fatto rientrare. Trascorsi due secondi dalla disattivazione del sensore A, S2 viene nuovamente esteso mentre S1 rientra, consentendo la lavorazione del vasetto successivo.» Che cosa indica «nuovamente»?","A":"Per la prima volta","B":"Un'altra volta, come prima","C":"In modo nuovo e diverso","D":"Molto lentamente","risposta":"B","feedback":"«Nuovamente» significa di nuovo: S2 era già esteso all'inizio del ciclo e torna nella stessa posizione.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Completata la tappatura lo stopper libera il vasetto in modo da lasciarlo procedere verso la stazione di ispezione.» Nel brano, che cosa significa «in modo da»?","A":"Con lo scopo di","B":"A causa di","C":"Nonostante","D":"Prima di","risposta":"A","feedback":"L'espressione introduce una finalità: lo stopper si apre per consentire al vasetto di avanzare.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «I prodotti non conformi vengono espulsi dalla linea, mentre gli altri procedono verso il fine linea, dove una spalla di contenimento ne blocca l'avanzamento.» A che cosa si riferisce «ne» in «ne blocca l'avanzamento»?","A":"Alla spalla","B":"Al cilindro","C":"Agli altri vasetti","D":"Alla linea","risposta":"C","feedback":"«Ne» equivale a «di essi» e richiama i vasetti conformi, il cui avanzamento viene fermato in fondo alla linea.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il segnale di giudizio complessivo è generato prima che il vasetto raggiunga il sensore D.» Che cosa si può dedurre?","A":"Che il verdetto sul vasetto è pronto prima che arrivi al punto di espulsione","B":"Che il vasetto non viene valutato","C":"Che il sensore D genera il giudizio","D":"Che il giudizio arriva dopo l'espulsione","risposta":"A","feedback":"Dal testo si capisce che il giudizio precede il passaggio davanti a D, così il sistema sa se espellere o no il vasetto.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il segnale di sincronizzazione per l'avvio della misura deve restare attivo per almeno un millisecondo, e il segnale di processo in corso resta a livello alto mentre viene elaborata la misura.» Nel brano, che cosa significa «per almeno un millisecondo»?","A":"Per un millisecondo esatto","B":"Non più di un millisecondo","C":"Per un millisecondo o più","D":"Mai per un millisecondo","risposta":"C","feedback":"«Almeno» fissa un limite minimo: il segnale può durare un millisecondo oppure di più, ma non di meno.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, fatte le opportune ipotesi aggiuntive ritenute utili per meglio definire il progetto, rappresenti l'algoritmo.» Nel brano, che cosa significa «ipotesi aggiuntive»?","A":"Supposizioni da aggiungere ai dati forniti","B":"Errori da correggere","C":"Dati già presenti","D":"Soluzioni definitive","risposta":"A","feedback":"Quando i dati del testo non bastano, il candidato può formulare ipotesi ulteriori e ragionevoli per completare il quadro.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Affinché l'analisi effettuata dalla smart camera sia affidabile è necessario che l'illuminazione percepita sia costante; l'illuminazione ambientale è percepita come un disturbo.» Nel brano, che cosa significa «disturbo»?","A":"Un rumore sonoro","B":"Un fattore indesiderato che altera la misura","C":"Un aiuto","D":"Un segnale di comando","risposta":"B","feedback":"In ambito tecnico, un disturbo è un elemento esterno che interferisce con il sistema e ne compromette la regolarità.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato verifichi che l'entità dell'errore a regime permanente è circa 11 lux.» Nel brano, che cosa significa «entità»?","A":"L'ente responsabile","B":"L'identità","C":"La grandezza, l'ammontare","D":"L'origine","risposta":"C","feedback":"Qui «entità» è sinonimo di grandezza o misura: si chiede di verificare quanto vale l'errore.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Al fine di aumentare la produttività del sistema si decide di sostituire il dosatore gravimetrico con una pompa volumetrica rotativa.» Nel brano, che cosa significa «produttività»?","A":"La quantità di prodotto ottenuta nell'unità di tempo","B":"La qualità del miele","C":"Il costo del sistema","D":"Il rumore della macchina","risposta":"A","feedback":"La produttività misura quanto si produce in un dato tempo: aumentarla significa riempire più vasetti nello stesso intervallo.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Per ciascuna rotazione effettuata dalla pompa viene versato nel vasetto una quantità precisa di miele. Lo spegnimento dell'alimentazione elettrica del motore produce l'immediato arresto del versamento.» Nel brano, che cosa significa «immediato»?","A":"Che avviene senza ritardo","B":"Che avviene con lentezza","C":"Che non avviene","D":"Che avviene dopo","risposta":"A","feedback":"Immediato indica un effetto istantaneo: tolta l'alimentazione, il miele smette subito di scorrere. Questo permette di fermarsi con precisione.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Al fine di far comunicare tra loro i dispositivi presenti nelle sottoreti A e B, il candidato identifichi la tipologia di dispositivo da sostituire al blocco incognito.» Nel brano, che cosa significa «sostituire al blocco incognito»?","A":"Cancellare il blocco","B":"Mettere un dispositivo adatto al posto del blocco di cui non si conosce la natura","C":"Spostare il blocco","D":"Nascondere il blocco","risposta":"B","feedback":"Il blocco indicato con un punto interrogativo è «incognito», cioè sconosciuto: il candidato deve stabilire che cosa metterci.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato definisca le principali caratteristiche dei dispositivi, anche in considerazione della topologia rappresentata.» Nel brano, che cosa significa «in considerazione di»?","A":"Senza tener conto di","B":"Tenendo conto di","C":"A prescindere da","D":"In sostituzione di","risposta":"B","feedback":"L'espressione indica che la scelta va fatta valutando anche l'elemento citato: la topologia della rete.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, ipotizzando di essere l'amministratore di rete, definisca come suddividere logicamente la rete e rappresenti la topologia logica.» Nel brano, che cosa significa «logicamente»?","A":"Con ragionevolezza","B":"Fisicamente, con cavi","C":"In base all'organizzazione degli indirizzi, non dei collegamenti fisici","D":"In ordine alfabetico","risposta":"C","feedback":"Una suddivisione logica riguarda la struttura degli indirizzi e delle sottoreti, non la posizione dei cavi.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La posizione del vassoio è individuata mediante un encoder incrementale calettato sull'albero del rullo di traino.» Nel brano, che cosa significa «calettato»?","A":"Bloccato in modo solidale","B":"Appoggiato","C":"Verniciato","D":"Rimosso","risposta":"A","feedback":"Calettare vuol dire fissare un elemento a un albero in modo che ruotino insieme: l'encoder gira con il rullo.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato individui il modello di encoder che permette di ottenere la posizione del vassoio con una precisione non inferiore a 0,5 millimetri.» Che cosa significa «non inferiore a 0,5 millimetri»?","A":"Peggiore di 0,5 millimetri","B":"Uguale o migliore di 0,5 millimetri","C":"Esattamente 0,5 millimetri","D":"Superiore a 5 millimetri","risposta":"B","feedback":"Una precisione non inferiore a 0,5 mm vuol dire che l'errore massimo non supera 0,5 mm: è ammesso quel valore o uno migliore.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Quando la coppia resistente al movimento rotazionale delle pale scende al di sotto di un valore prefissato il motore viene arrestato e gli agitatori vengono estratti dai recipienti.» Che cosa indica la discesa della coppia resistente?","A":"Che il prodotto è diventato più fluido","B":"Che il motore si è guastato","C":"Che i recipienti sono vuoti","D":"Che le pale sono rotte","risposta":"A","feedback":"Più il prodotto è fluido, meno si oppone al movimento delle pale: il calo della coppia segnala quindi che l'agitazione è riuscita.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sistema di termoregolazione è a retroazione unitaria: il candidato ne verifichi la stabilità e, qualora instabile, suggerisca una possibile soluzione correttiva.» Nel brano, che cosa significa «qualora»?","A":"Nel caso in cui","B":"Dopo che","C":"Perché","D":"Nonostante","risposta":"A","feedback":"«Qualora» introduce un'ipotesi: la soluzione correttiva va proposta solo se il sistema risulta instabile.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, dopo aver definito il significato delle specifiche indicate, individui quale sia la scheda più adatta, motivando la scelta effettuata.» Nel brano, che cosa significa «specifiche»?","A":"Le persone esperte","B":"Le caratteristiche tecniche dichiarate","C":"Le istruzioni di montaggio","D":"I costi","risposta":"B","feedback":"Le specifiche sono i parametri tecnici elencati nella tabella: risoluzione, frequenza di campionamento, intervallo di ingresso.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Le vibrazioni rilevate sono dominate da una frequenza di risonanza a 7 kHz.» Nel brano, che cosa significa «dominate»?","A":"Soppresse","B":"Prevalentemente determinate","C":"Ignorate","D":"Duplicate","risposta":"B","feedback":"Quando una componente domina, è la più importante: le vibrazioni sono caratterizzate soprattutto da quella frequenza.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il codice deve descrivere cosa accade quando viene eseguita l'istruzione: il robot raggiunge una posizione di partenza, si avvicina al primo punto, percorre i quattro vertici e infine ritorna alla posizione iniziale.» Quale schema segue la sequenza?","A":"Parte da un punto di riposo, svolge il compito e vi ritorna","B":"Parte da un punto e non ritorna","C":"Svolge il compito senza partire","D":"Svolge il compito in ordine casuale","risposta":"A","feedback":"La sequenza è chiusa: il robot parte dalla posizione di riposo, esegue il percorso e ritorna alla posizione iniziale.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il codice è stato scritto per un robot che prende un oggetto da una posizione, lo solleva, lo porta in un'altra posizione e lo rilascia.» Quale tipo di applicazione si può ipotizzare?","A":"Verniciatura","B":"Saldatura","C":"Prelievo e posizionamento di oggetti","D":"Taglio laser","risposta":"C","feedback":"Prendere, trasportare e rilasciare un oggetto da un punto all'altro è la sequenza tipica di un'operazione di pick and place.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il robot raggiunge un punto, attiva un utensile, percorre i lati di un rettangolo tornando al punto di partenza, poi disattiva l'utensile e si allontana.» Quale lavorazione si può ipotizzare?","A":"Deposito di una traccia continua di materiale lungo un contorno chiuso","B":"Trasporto di oggetti","C":"Misura di temperatura","D":"Controllo visivo","risposta":"A","feedback":"L'utensile resta attivo solo durante il percorso del contorno chiuso: è tipico di un'applicazione di incollaggio o sigillatura.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sistema di tappatura è caratterizzato da una funzione di trasferimento: il candidato ne rappresenti l'andamento del modulo e calcoli il picco di risonanza.» Nel brano, che cosa indica «andamento»?","A":"Il modo in cui una grandezza varia","B":"La velocità del nastro","C":"Il costo","D":"La fine di un processo","risposta":"A","feedback":"L'andamento descrive come una grandezza cambia al variare di un'altra: qui, come varia il modulo al crescere della frequenza.","difficolta":2},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il tempo di riempimento si ottiene da una formula approssimata: il polo dominante, cioè quello più vicino allo zero, determina la rapidità con cui il sistema raggiunge il valore finale.» Nel brano, che cosa significa «approssimata»?","A":"Perfettamente esatta","B":"Che dà un valore vicino a quello reale, non identico","C":"Inutilizzabile","D":"Molto complicata","risposta":"B","feedback":"Una formula approssimata fornisce una stima ragionevole del risultato, accettando una piccola differenza dal valore esatto.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il polo dominante è il polo più vicino allo zero della funzione di trasferimento del sistema.» Nel brano, che cosa significa «più vicino allo zero»?","A":"Con valore assoluto minore rispetto agli altri poli","B":"Posto al centro del grafico","C":"Con valore negativo","D":"Con valore maggiore degli altri","risposta":"A","feedback":"La vicinanza allo zero indica un modulo piccolo: è il polo che determina la dinamica più lenta e perciò quella che conta di più.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La coppia resistente al movimento rotazionale degli agitatori viene rilevata tramite un torsiometro; il valore di coppia al di sotto del quale il livello di fluidità può ritenersi ottimale vale 4 Nm.» Quale ruolo ha il valore di 4 Nm?","A":"Indica il momento in cui fermare il motore","B":"Indica la coppia massima del motore","C":"Indica la velocità di rotazione","D":"Indica il peso del prodotto","risposta":"A","feedback":"Il testo collega la soglia di 4 Nm all'ottimo livello di fluidità: quando la coppia scende sotto quel valore, l'agitazione può concludersi.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, avendo a disposizione le schede DAQ caratterizzate dai parametri elencati in tabella, individui quale sia la più adatta, motivando la scelta effettuata e indicando uno schema di principio del collegamento tra sensore e scheda.» Nel brano, che cosa significa «schema di principio»?","A":"Uno schema dettagliato di montaggio","B":"Una rappresentazione semplificata dei collegamenti essenziali","C":"Un elenco di prezzi","D":"Una tabella di calcolo","risposta":"B","feedback":"Lo schema di principio mostra solo gli elementi e i collegamenti fondamentali, senza i dettagli costruttivi.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sensore piezoelettrico è caratterizzato da un intervallo di misura di più o meno 50 g, cioè la gamma di accelerazioni misurabili dal sensore, e da una frequenza di risposta tra 1 Hz e 10 kHz, cioè l'intervallo in cui fornisce misurazioni accurate.» Nel brano, che cosa significa «accurate»?","A":"Veloci","B":"Vicine al valore reale","C":"Elettriche","D":"Rumorose","risposta":"B","feedback":"Una misura accurata si avvicina al valore vero: fuori dall'intervallo di frequenza indicato, il sensore non garantisce questa qualità.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La rete principale deve essere suddivisa in quattro sottoreti, una per ciascun reparto; ogni sottorete deve avere un range IP sufficiente per gestire i dispositivi del reparto.» Nel brano, che cosa significa «sufficiente»?","A":"Il più ampio possibile","B":"Adeguato al bisogno, senza dover essere eccessivo","C":"Minimo e inadatto","D":"Sempre uguale per tutte","risposta":"B","feedback":"Sufficiente vuol dire abbastanza per lo scopo: l'intervallo di indirizzi deve bastare per i dispositivi del reparto.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La smart camera si interfaccia con l'unità di controllo mediante segnali di sincronizzazione, di processo in corso e di giudizio complessivo.» Nel brano, che cosa significa «si interfaccia»?","A":"Si sostituisce","B":"Si collega per comunicare","C":"Si spegne","D":"Si nasconde","risposta":"B","feedback":"Interfacciarsi significa scambiare informazioni con un altro dispositivo attraverso un collegamento definito.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, fatte le opportune ipotesi aggiuntive, formalizzi una tabella degli input e output valida per l'unità di controllo.» Nel brano, che cosa significa «formalizzi»?","A":"Renda ufficiale e ordinata secondo uno schema preciso","B":"Cancelli","C":"Racconti in modo discorsivo","D":"Dimentichi","risposta":"A","feedback":"Formalizzare significa dare una forma definita e rigorosa: qui, una tabella con segnali, tipi e ruoli precisi.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il vassoio è trasportato attraverso due stazioni di lavorazione: nella prima il prodotto viene agitato per renderlo più fluido, nella seconda viene riscaldato per un tempo prefissato.» Che ordine seguono le operazioni?","A":"Prima il riscaldamento, poi l'agitazione","B":"Prima l'agitazione, poi il riscaldamento","C":"Contemporaneamente","D":"In ordine casuale","risposta":"B","feedback":"«Dapprima» e «in seguito» indicano che l'agitazione precede il riscaldamento.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «La pompa volumetrica rotativa versa una quantità precisa di miele a ogni giro del motore; perciò, contando i giri, si può conoscere il volume versato senza pesarlo.» Quale ragionamento propone il brano?","A":"Se a ogni giro corrisponde un volume fisso, contare i giri equivale a misurare la quantità","B":"Occorre sempre pesare il miele","C":"Il volume dipende dalla temperatura","D":"Il motore deve girare più veloce","risposta":"A","feedback":"Il brano stabilisce un rapporto costante tra giri e volume: da questo si deduce che il numero di giri basta a misurare ciò che è stato versato.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il regolatore a modello proporzionale produce un segnale di comando proporzionale all'errore; tuttavia, in presenza di un disturbo costante, resta a regime un errore residuo.» Nel brano, che cosa significa «residuo»?","A":"Che rimane anche dopo la regolazione","B":"Che scompare subito","C":"Molto grande","D":"Causato da un guasto","risposta":"A","feedback":"Residuo indica ciò che permane: nonostante il controllo, una piccola differenza dal valore desiderato non si annulla.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il termoregolatore ad azione PI mantiene il forno a una temperatura costante, dove il vassoio sosta per due minuti, trascorsi i quali il nastro si riavvia.» A che cosa si riferisce «i quali»?","A":"Ai vassoi","B":"Ai due minuti","C":"Al termoregolatore","D":"Al forno","risposta":"B","feedback":"Il pronome richiama «due minuti»: il nastro riparte quando il tempo di sosta è trascorso.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato, sulla base delle proprie conoscenze e competenze, descriva cosa accade quando viene eseguita l'istruzione e ipotizzi per quale applicazione sia stato progettato il codice.» Che cosa gli si chiede di fare, in ordine?","A":"Ipotizzare l'applicazione e poi descrivere l'esecuzione","B":"Descrivere l'esecuzione e poi ipotizzare l'applicazione","C":"Scrivere un nuovo codice","D":"Correggere gli errori","risposta":"B","feedback":"La sequenza «dopo aver descritto... ipotizzi» indica prima la descrizione di ciò che accade e poi la formulazione dell'ipotesi sull'uso.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'impianto è gestito da un'unità di controllo in logica programmabile: i sensori inviano i segnali, l'unità li elabora e comanda di conseguenza gli attuatori.» Nel brano, che cosa significa «di conseguenza»?","A":"Contro quanto rilevato","B":"In modo coerente con quanto elaborato","C":"Senza criterio","D":"Prima di elaborare","risposta":"B","feedback":"L'espressione indica che i comandi dipendono dai segnali ricevuti: sono una conseguenza logica dell'elaborazione.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «L'illuminazione percepita dalla camera è data dalla somma tra la luce generata dall'illuminatore e quella ambientale, che la camera percepisce come un disturbo.» Che cosa si può dedurre?","A":"Che la luce ambientale è utile","B":"Che la luce ambientale altera la luce totale e quindi va compensata","C":"Che l'illuminatore è inutile","D":"Che la camera non ha bisogno di luce","risposta":"B","feedback":"Se la luce ambientale si somma a quella dell'illuminatore e viene vista come disturbo, il sistema deve compensarla per mantenere costante l'illuminazione.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il robot raggiunge la posizione di approccio, cioè un punto spostato di dieci unità sopra il punto di lavoro, prima di scendere.» Nel brano, che cosa significa «posizione di approccio»?","A":"Una posizione intermedia di avvicinamento","B":"La posizione finale","C":"Una posizione di guasto","D":"La posizione di spegnimento","risposta":"A","feedback":"L'approccio è un avvicinamento prudente: si arriva sopra il punto e poi si scende, evitando urti con l'oggetto o il pezzo.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Un operatore posiziona il vassoio; solo alla pressione del pulsante di avvio i due erogatori si abbassano; quindi l'unità invia un segnale di START al regolatore di livello.» Quale vincolo emerge dal brano?","A":"Gli erogatori si abbassano prima del pulsante","B":"Il riempimento comincia solo dopo l'abbassamento degli erogatori e il segnale di START","C":"Il pulsante non serve","D":"Il vassoio si posiziona da solo","risposta":"B","feedback":"Gli eventi sono ordinati: pulsante, discesa degli erogatori, segnale di START, poi riempimento.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato dimostri che il tempo necessario al riempimento del contenitore, a partire dall'istante in cui si attiva il regolatore, è circa un minuto.» Nel brano, che cosa significa «dimostri»?","A":"Indovini","B":"Provi con un ragionamento o un calcolo","C":"Neghi","D":"Descriva a parole","risposta":"B","feedback":"Dimostrare significa provare la correttezza di un'affermazione con argomenti e calcoli: qui, che il tempo è circa un minuto.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il candidato individui il modello di encoder, tra quelli indicati in tabella, giustificando adeguatamente la risposta.» Che cosa significa «tra quelli indicati in tabella»?","A":"Il modello può essere scelto soltanto tra quelli elencati","B":"Il modello va inventato","C":"Sono esclusi i modelli in tabella","D":"La tabella non serve","risposta":"A","feedback":"L'espressione restringe la scelta ai modelli elencati: il candidato non può proporne altri.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Alla frequenza di risonanza la massima intensità della vibrazione rilevata può arrivare fino a 6 g; la variazione minima che si vuole rilevare è di 0,005 g.» Che cosa indicano i due valori considerati insieme?","A":"Il campo di misura da coprire e la finezza richiesta","B":"Solo la frequenza","C":"La tensione di alimentazione","D":"Il costo","risposta":"A","feedback":"6 g è il valore massimo da misurare, 0,005 g è il più piccolo cambiamento da distinguere: insieme definiscono ampiezza e risoluzione richieste.","difficolta":3},{"materia":"Italiano","argomento":"Comprensione del testo","sottoargomento":"Prosa","nodo":"Tecnica","testo":"Brano: «Il sistema di controllo regola l'illuminatore in modo proporzionale all'errore; con il disturbo di -400 lux, il valore a regime non coincide perfettamente con il riferimento di 1000 lux.» Nel brano, che cosa indica «non coincide perfettamente»?","A":"Che c'è una piccola differenza tra valore ottenuto e desiderato","B":"Che i valori sono identici","C":"Che il sistema è spento","D":"Che il riferimento è sbagliato","risposta":"A","feedback":"Il testo parla di un errore a regime: il valore raggiunto si avvicina al riferimento senza raggiungerlo del tutto.","difficolta":3}];
var state = { items: [], idx: 0, answers: [], shuffled: [], finito: false };
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function init(){
  state.items = shuffle(QUIZ_DATA);
  state.idx = 0;
  state.answers = [];
  state.finito = false;
  state.shuffled = state.items.map(function(q){
    var opts = [
      { lettera: 'A', testo: q.A },
      { lettera: 'B', testo: q.B },
      { lettera: 'C', testo: q.C },
      { lettera: 'D', testo: q.D }
    ];
    var corretta = q.risposta;
    var mescolate = shuffle(opts);
    var correctIdx = -1;
    mescolate.forEach(function(o, i){ if(o.lettera === corretta) correctIdx = i; });
    return { opzioni: mescolate, correctIdx: correctIdx };
  });
  render();
}
function render(){
  if(state.finito){ renderSummary(); return; }
  var q = state.items[state.idx];
  var sh = state.shuffled[state.idx];
  var answered = state.answers[state.idx] !== undefined;
  var chosen = state.answers[state.idx];
  var total = state.items.length;
  var optsHtml = sh.opzioni.map(function(o, i){
    var cls = 'opt-clean';
    if(answered){
      cls += ' disabled';
      if(i === sh.correctIdx) cls += ' correct';
      else if(i === chosen) cls += ' incorrect';
      else cls += ' dim';
    }
    var letteraMostrata = ['A','B','C','D'][i];
    return '<button class="' + cls + '" data-i="' + i + '" ' + (answered?'disabled':'') + '>'
      + '<span class="opt-letter">' + letteraMostrata + '</span>'
      + '<span>' + esc(o.testo) + '</span>'
      + '</button>';
  }).join('');
  var feedbackHtml = '';
  if(answered){
    if(chosen === sh.correctIdx) feedbackHtml = '<div class="feedback ok">✓ Esatto!</div>';
    else feedbackHtml = '<div class="feedback bad">✗ Sbagliato — la risposta corretta è la ' + ['A','B','C','D'][sh.correctIdx] + '</div>';
    if(q.feedback) feedbackHtml += '<div class="explain-box"><span class="explain-label">💡 Spiegazione</span>' + esc(q.feedback) + '</div>';
  }
  var progressPct = Math.round((state.idx / total) * 100);
  var isLast = state.idx === total - 1;
  var nextLabel = isLast ? 'Vedi risultati →' : 'Prossima →';
  var tagText = esc(q.materia) + ' › ' + esc(q.nodo);
  var diffLabel = ({1:'Base',2:'Intermedio',3:'Avanzato'})[Number(q.difficolta)] || '';
  var diffClass = 'd' + Number(q.difficolta);
  var answeredCount = state.answers.filter(function(a){return a!==undefined;}).length;
  document.getElementById('app').innerHTML = 
    '<div class="topbar">'
    + '<div class="title">Quiz · ' + total + ' domande</div>'
    + '</div>'
    + '<div class="progressbar-top"><div class="progressbar-top-fill" style="width:' + progressPct + '%"></div></div>'
    + '<div class="quiz-meta"><span>Domanda ' + (state.idx + 1) + '/' + total + '</span><span>' + answeredCount + '/' + total + ' risposte</span></div>'
    + '<div class="content">'
    + '<div class="qcard-clean">'
    + '<div class="qcard-clean-head">'
    + '<span class="eyebrow">' + tagText + '</span>'
    + '<span class="diff-pill ' + diffClass + '">' + diffLabel + '</span>'
    + '</div>'
    + '<div class="q-text">' + esc(q.testo) + '</div>'
    + optsHtml
    + feedbackHtml
    + '</div>'
    + '</div>'
    + '<div class="footer-bar">'
    + '<button class="btn btn-primary btn-block" id="btnNext" ' + (!answered ? 'disabled' : '') + '>' + nextLabel + '</button>'
    + '</div>';
  var optBtns = document.querySelectorAll('.opt-clean');
  for(var i=0;i<optBtns.length;i++){
    (function(btn){
      btn.addEventListener('click', function(){
        if(state.answers[state.idx] !== undefined) return;
        state.answers[state.idx] = Number(btn.getAttribute('data-i'));
        render();
      });
    })(optBtns[i]);
  }
  var btnNext = document.getElementById('btnNext');
  if(btnNext){
    btnNext.addEventListener('click', function(){
      if(state.idx === state.items.length - 1){ state.finito = true; render(); window.scrollTo(0,0); return; }
      state.idx++;
      render();
      window.scrollTo(0,0);
    });
  }
}
function renderSummary(){
  var total = state.items.length;
  var correctCount = 0;
  state.items.forEach(function(q, i){ if(state.answers[i] === state.shuffled[i].correctIdx) correctCount++; });
  var pct = Math.round((correctCount / total) * 100);
  var stampClass = pct >= 70 ? 'good' : (pct >= 45 ? 'mid' : '');
  var rows = state.items.map(function(q, i){
    var chosen = state.answers[i];
    var sh = state.shuffled[i];
    var ok = chosen === sh.correctIdx;
    var chosenTesto = chosen !== undefined ? sh.opzioni[chosen].testo : '(nessuna risposta)';
    var correctTesto = sh.opzioni[sh.correctIdx].testo;
    var letteraCorr = ['A','B','C','D'][sh.correctIdx];
    var letteraScelta = chosen !== undefined ? ['A','B','C','D'][chosen] : '';
    return '<div class="review-row">'
      + '<div class="ico">' + (ok ? '✅' : '❌') + '</div>'
      + '<div class="body">'
      + '<div class="rq">' + esc(q.testo) + '</div>'
      + '<div class="ra">'
      + (!ok ? '<span class="wrong-ans">' + letteraScelta + '. ' + esc(chosenTesto) + '</span>' : '')
      + '<b>' + letteraCorr + '. ' + esc(correctTesto) + '</b>'
      + '</div>'
      + (q.feedback ? '<div class="explain-box" style="margin-top:8px;"><span class="explain-label">💡 Spiegazione</span>' + esc(q.feedback) + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
  var caption = '';
  if(pct >= 85) caption = 'Ottimo lavoro — quasi tutto corretto.';
  else if(pct >= 70) caption = 'Buon risultato, continua così.';
  else if(pct >= 45) caption = 'Discreto: ripassa i punti deboli.';
  else caption = 'Serve altro ripasso su questi argomenti.';
  document.getElementById('app').innerHTML =
    '<div class="topbar"><div class="title">Risultato</div></div>'
    + '<div class="content">'
    + '<div class="stamp-result">'
    + '<div class="stamp-circle ' + stampClass + '"><b>' + correctCount + '/' + total + '</b><span>' + pct + '%</span></div>'
    + '<div class="stamp-caption">' + caption + '</div>'
    + '</div>'
    + '<div class="actions" style="margin-top:22px;">'
    + '<button class="btn btn-secondary btn-block" id="btnRifai">🔄 Rifai il quiz</button>'
    + '</div>'
    + '<div class="section-head"><h2>Revisione completa</h2></div>'
    + rows
    + '</div>';
  var btnRifai = document.getElementById('btnRifai');
  if(btnRifai) btnRifai.addEventListener('click', function(){ init(); window.scrollTo(0,0); });
}
init();
</script>
